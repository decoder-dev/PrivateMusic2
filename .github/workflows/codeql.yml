# CodeQL for the languages in this repository. The Xcode project is generated
# by XcodeGen, so Swift is analysed from source (build-mode none) instead of
# autobuild, which would find no project to build. The only remaining C is the
# reference copy used by the Rust differential tests, so c-cpp is not scanned.
# Actions are pinned by commit SHA; Dependabot proposes the bumps.
name: "CodeQL"

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "docs/**", "**/*.md" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "docs/**", "**/*.md" ]
  schedule:
    - cron: '28 14 * * 4'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
        - language: python
        - language: rust
        - language: swift

    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-extended

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        category: "/language:${{ matrix.language }}"
