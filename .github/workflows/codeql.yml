# CodeQL for the languages in this repository. The Xcode project is generated
# by XcodeGen, so Swift uses a manual build (CodeQL has no source-only mode
# for Swift and autobuild would find no project). The only remaining C is the
# reference copy used by the Rust differential tests, so c-cpp is not scanned.
# Actions are pinned by commit SHA; Dependabot proposes the bumps.
name: "CodeQL"

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "docs/**", "**/*.md" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "docs/**", "**/*.md" ]
  schedule:
    - cron: '28 14 * * 4'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-26') || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: python
          build-mode: none
        - language: rust
          build-mode: none
        - language: swift
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    # Installed before CodeQL starts tracing: the traced shell runs under
    # Rosetta, where Homebrew refuses to install into /opt/homebrew.
    - name: Prepare Xcode project
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        sudo xcode-select -s /Applications/Xcode_26.5.app
        brew install xcodegen
        xcodegen generate

    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ./.github/codeql/codeql-config.yml
        queries: security-extended

    - name: Build Swift sources
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        set -o pipefail
        xcodebuild \
          -project PrivateMusic.xcodeproj \
          -scheme PrivateMusic \
          -destination "generic/platform=iOS Simulator" \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: "/language:${{ matrix.language }}"
