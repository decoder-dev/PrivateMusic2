name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Xcode 26.5)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -destination \
              "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' test.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

  build:
    name: Build IPA (Xcode 27)
    needs: test
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Prepare Metal toolchain
        run: sudo xcodebuild -downloadComponent MetalToolchain || true

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned iPhone and Watch applications
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            -archivePath "$PWD/build/PrivateMusic.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee release-build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' release-build.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

      - name: Validate embedded Apple Watch application
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          python3 scripts/validate_watch_bundle.py "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          mkdir -p artifacts
          # Full IPA (iPhone + Watch) — Apple unsigned recipe via Info-ZIP.
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.28.71-unsigned.ipa"
          # iPhone-only IPA — for ESign / Sideloadly / Feather that choke on
          # embedded Watch PlugIns during import/unpack/resign.
          bash ./scripts/package_unsigned_ipa.sh --strip-watch \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.28.71-iphone-unsigned.ipa"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v3.28.71"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<'EOF'
          # Private Music 3.28.71 (pre-release)

          Полка «Плейлисты» показывает все плейлисты, музыка выключается
          при отключении наушников, а очередь из Медиатеки называет себя
          «Ваши треки».

          ## Плейлисты
          - Настоящая причина последнего «они не все»: VK раскладывает
            один и тот же список по нескольким блокам ответа, а разбор
            останавливался на первом непустом. В присланном случае в
            `items` лежала одна запись, а остальные семь — в соседних
            блоках, и на полке была одна карточка
          - Записи теперь собираются из всех блоков сразу — `items`,
            `playlists`, `albums`, `response`, `list`, `blocks`,
            `sections` — и склеиваются по идентификатору владельца, так
            что один плейлист остаётся одной карточкой
          - Обёртка вокруг записи разворачивается до самого плейлиста:
            у блока бывает собственный идентификатор, и карточка по нему
            не открывалась
          - Пагинация по-прежнему считает страницу по блоку `items`:
            записи из соседних блоков — это копия того же списка, а не
            продолжение, и шагать через них значило бы пропускать то,
            что VK ещё не прислал
          - Прошлые исправления остались на месте: «Альбомы» просят
            `filters=albums`, разбор по признакам записи не выбрасывает
            плейлисты, а плейлист без названия по-прежнему виден

          ## Наушники
          - Отключение наушников поднимает и прерывание, и смену
            маршрута, и порядок между ними не гарантирован. Если
            прерывание приходило первым, оно уже ставило паузу и снимало
            признак воспроизведения — смена маршрута считала, что играть
            нечего, и музыка уходила в динамик
          - Потеря маршрута теперь определяется по самому маршруту, а
            пауза ставится безусловно
          - Отложенное возобновление после прерывания дольше ждёт, пока
            маршрут устоится, и перед стартом ещё раз проверяет его: если
            наушников уже нет, возобновление откладывается до следующего
            устройства, а не звучит из динамика

          ## Очередь
          - Запуск из Медиатеки подписан «Ваши треки», а не миксом по
            нажатому треку
          - В шапке «Треки» появилась кнопка «Перемешать»: она
            перемешивает только свою очередь и не трогает настройку, так
            что следующее нажатие на строку снова играет по порядку
          - Нажатие на трек в Медиатеке по-прежнему ставит в очередь
            видимый список в видимом порядке и продолжается следующей
            страницей библиотеки

          ## Установка
          IPA не подписан.
          - **`…-iphone-unsigned.ipa`** — без Watch
          - `…-unsigned.ipa` — полная сборка с Watch
          EOF
          ASSETS=(
            "$PWD/artifacts/PrivateMusic-3.28.71-iphone-unsigned.ipa"
            "$PWD/artifacts/PrivateMusic-3.28.71-unsigned.ipa"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Private Music 3.28.71" \
              --notes-file "$NOTES" \
              --draft=false \
              --prerelease
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "Private Music 3.28.71" \
              --notes-file "$NOTES" \
              --prerelease
          fi

      - name: Upload unsigned IPA
        if: success() || failure()
        uses: actions/upload-artifact@v5
        with:
          name: PrivateMusic-3.28.71-unsigned
          path: |
            artifacts/PrivateMusic-3.28.71-iphone-unsigned.ipa
            artifacts/PrivateMusic-3.28.71-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
