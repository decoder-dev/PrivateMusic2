name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Xcode 26.5)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -destination \
              "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' test.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

  build:
    name: Build IPA (Xcode 27)
    needs: test
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Prepare Metal toolchain
        run: sudo xcodebuild -downloadComponent MetalToolchain || true

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned iPhone and Watch applications
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            -archivePath "$PWD/build/PrivateMusic.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee release-build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' release-build.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

      - name: Validate embedded Apple Watch application
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          python3 scripts/validate_watch_bundle.py "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          mkdir -p artifacts
          # Full IPA (iPhone + Watch) — Apple unsigned recipe via Info-ZIP.
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.28.79-unsigned.ipa"
          # iPhone-only IPA — for ESign / Sideloadly / Feather that choke on
          # embedded Watch PlugIns during import/unpack/resign.
          bash ./scripts/package_unsigned_ipa.sh --strip-watch \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.28.79-iphone-unsigned.ipa"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v3.28.79"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<'EOF'
          # Private Music 3.28.79 (pre-release)

          Треки, которые «не грузятся» и «не играют»: play больше не
          тыкает в мёртвый AVPlayerItem, refresh не клинит после
          shuffle, нет URL больше не маскируется под таймаут сети.
          Share/офлайн demux (MPEG-TS, CMAF) и VK unmask ушли в C.

          ## Очередь из Медиатеки
          - У медиатеки свой потолок очереди (до 2000), отдельный от
            лимита миксов (80). Раньше `appendToQueue` резал догрузку
            лимитом микса, и при «Трек 1 из 100» следующие страницы
            библиотеки в очередь не попадали
          - Continuation после старта сразу догружает следующие страницы
            `audio.get` в порядке списка, так что 833 трека дорастают
            в очереди, а не остаются на первой сотне

          ## Перемешать
          - У заголовка «Треки» кнопка «Перемешать» с подписью
          - Шаффл — per-collection: глобальный shuffle и настройка не
            залипают; следующий тап по строке снова играет по порядку

          ## Ваши треки
          - Очередь из медиатеки (и шаффл тоже) подписывается «Ваши треки»

          ## Обложки альбомов
          - Декод обложек читает `thumbs` / grid / вложенные photo и
            нормализует HTTP CDN в HTTPS — часть альбомов после обновления
            VK больше не остаётся серой ноткой

          ## Загрузка и старт трека
          - Play / lock screen после неудачной загрузки заново берёт
            stream URL, а не вызывает `play()` на `.failed` item
          - Refresh стрима сверяется по id трека и всегда освобождает слот
            (shuffle / play next больше не клинят последующие загрузки)
          - Пустой или `audio_api_unavailable` URL — одна попытка getById,
            затем skip/ошибка, а не 8–12 «таймаутов»
          - После restore сохранённый https URL играет сразу; getById
            блокирует только если играть нечем
          - Offline stall больше не жрёт retry-бюджет; возврат сети
            сбрасывает backoff и стартует короткое окно 0.1–0.5 с
          - Пауза отменяет in-flight recovery, чтобы трек не стартовал
            сам после снятия наушников
          - Stream refresh не ждёт connectivity (fail-fast)

          ## Сетевое восстановление
          - Обновление stream URL больше не делает вложенные ретраи внутри
            внешнего recovery-цикла плеера
          - Возврат сети поднимает текущий трек через короткое jitter-окно
            (0.1–0.5 c), а не после старого backoff
          - Offline-состояние гасит устаревшие recovery-задачи без расхода
            retry-бюджета
          - API retry не повторяет 501/505; добавлен retry для
            `resourceUnavailable`

          ## Альбомы исполнителя
          - Полка «Альбомы» больше не принимает audio-строки за релизы
          - Sparse ответ getAlbumsByArtist уступает catalog / обогащается
            треками с той же страницы (count + обложка)

          ## Стабильность подключения
          - После звонка / Siri плеер сам резюмирует без переоткрытия
            приложения (и при возврате на передний план)
          - На слабой сети (cellular / constrained) буфер шире и retry
            мягче; возврат из offline поднимает тот же трек
          - Повтор `setActive` после сброса сессии; stall не клинит на
            осиротевших задачах; оценка буфера в C (`pm_buffer_health_*`)

          ## Наушники
          - Снятие наушников с уха больше не возобновляет музыку: пауза
            смотрит, играл ли кто-то ещё (звонок / Siri)
          - Обрыв маршрута и media-services reset не открывают автоплей
            на динамик iPhone

          ## Share / офлайн (C)
          - MPEG-TS demux больше не режет Swift `Data` на каждый пакет
            188 байт (share stitch / офлайн)
          - Один ISO BMFF walker на CMAF и HLS (`ftyp`/`moov`/`moof`/`mdat`)
          - VK URL unmask (alphabet / shuffle) на каждом getById
          - Time observer складывает `loadedTimeRanges` в C, без Array

          ## Установка
          IPA не подписан.
          - **`…-iphone-unsigned.ipa`** — без Watch
          - `…-unsigned.ipa` — полная сборка с Watch
          EOF
          ASSETS=(
            "$PWD/artifacts/PrivateMusic-3.28.79-iphone-unsigned.ipa"
            "$PWD/artifacts/PrivateMusic-3.28.79-unsigned.ipa"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Private Music 3.28.79" \
              --notes-file "$NOTES" \
              --draft=false \
              --prerelease
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "Private Music 3.28.79" \
              --notes-file "$NOTES" \
              --prerelease
          fi

      - name: Upload unsigned IPA
        if: success() || failure()
        uses: actions/upload-artifact@v5
        with:
          name: PrivateMusic-3.28.79-unsigned
          path: |
            artifacts/PrivateMusic-3.28.79-iphone-unsigned.ipa
            artifacts/PrivateMusic-3.28.79-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
