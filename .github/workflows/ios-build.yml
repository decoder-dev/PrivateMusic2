name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Xcode 26.5)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -destination \
              "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' test.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

  build:
    name: Build IPA (Xcode 27)
    needs: test
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Prepare Metal toolchain
        run: sudo xcodebuild -downloadComponent MetalToolchain || true

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned iPhone and Watch applications
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            -archivePath "$PWD/build/PrivateMusic.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee release-build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' release-build.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

      - name: Validate embedded Apple Watch application
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          python3 scripts/validate_watch_bundle.py "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          mkdir -p artifacts
          # Full IPA (iPhone + Watch) — Apple unsigned recipe via Info-ZIP.
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.28.70-unsigned.ipa"
          # iPhone-only IPA — for ESign / Sideloadly / Feather that choke on
          # embedded Watch PlugIns during import/unpack/resign.
          bash ./scripts/package_unsigned_ipa.sh --strip-watch \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.28.70-iphone-unsigned.ipa"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v3.28.70"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<'EOF'
          # Private Music 3.28.70 (pre-release)

          Полка «Плейлисты» в Медиатеке снова показывает все плейлисты, а
          не один.

          ## Плейлисты
          - Настоящая причина: полка «Альбомы» просила у VK
            `filters=followed,albums`, а `filters` объединяет
            перечисленные категории — VK отвечал не только релизами, но и
            всеми плейлистами, сохранёнными у других людей. Полка
            «Плейлисты» убирает всё, что пришло в «Альбомах», поэтому у
            многих оставались только свои плейлисты, часто один
          - Теперь «Альбомы» запрашивают `filters=albums`: в списке одни
            релизы, и с полки «Плейлисты» больше нечему пропадать.
            Разбор по записям остался вторым рубежом
          - Прошлые сборки чинили это со стороны признаков записи, но VK
            присылает сохранённый плейлист без единого признака
            плейлиста, поэтому один и тот же дефект возвращался
          - Страница списка читается не только из одного блока: записи
            берутся и из блока `playlists`/`albums`, обёртка `playlist`
            разворачивается, а аудиозапись за плейлист не принимается
          - Плейлист без названия больше не выбрасывается — карточка
            появляется без подписи, а не пропадает; идентификаторы,
            пришедшие строкой, тоже разбираются
          - Свои плейлисты определяются по тому же идентификатору
            аккаунта, что и офлайн-хранилища, поэтому сессия, восстановленная
            до загрузки профиля, больше не оставляет их без защиты

          ## Очередь
          - Нажатие на трек в Медиатеке ставит в очередь именно тот
            список, который виден на экране, в том же порядке
          - «Перемешать» на альбоме, плейлисте или миксе перемешивает
            только свою очередь и больше не оставляет перемешивание
            включённым для следующего запуска из Медиатеки
          - У кого перемешивание «залипло» после старых версий, оно
            один раз сбрасывается
          - Очередь из Медиатеки продолжается следующей страницей
            библиотеки в порядке VK, а рекомендации подключаются только
            после того, как библиотека закончилась

          ## Установка
          IPA не подписан.
          - **`…-iphone-unsigned.ipa`** — без Watch
          - `…-unsigned.ipa` — полная сборка с Watch
          EOF
          ASSETS=(
            "$PWD/artifacts/PrivateMusic-3.28.70-iphone-unsigned.ipa"
            "$PWD/artifacts/PrivateMusic-3.28.70-unsigned.ipa"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Private Music 3.28.70" \
              --notes-file "$NOTES" \
              --draft=false \
              --prerelease
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "Private Music 3.28.70" \
              --notes-file "$NOTES" \
              --prerelease
          fi

      - name: Upload unsigned IPA
        if: success() || failure()
        uses: actions/upload-artifact@v5
        with:
          name: PrivateMusic-3.28.70-unsigned
          path: |
            artifacts/PrivateMusic-3.28.70-iphone-unsigned.ipa
            artifacts/PrivateMusic-3.28.70-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
