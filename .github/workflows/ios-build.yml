name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Prepare Metal toolchain
        run: |
          # Preview xcode-27 images have shipped without MetalToolchain;
          # SwiftUI test hosts can hang without it.
          sudo xcodebuild -downloadComponent MetalToolchain || true

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve iOS 27 simulator
        id: sim
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/pm-sim-udid.txt
          import json
          import subprocess
          import sys

          raw = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          )
          data = json.loads(raw)
          preferred = (
              "iPhone 17 Pro",
              "iPhone 17",
              "iPhone 17 Pro Max",
              "iPhone Air",
              "iPhone 17e",
          )
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS-27" not in runtime and "iOS 27" not in runtime:
                  continue
              for device in devices:
                  if not device.get("isAvailable", True):
                      continue
                  candidates.append((device.get("name", ""), device["udid"]))
          for name in preferred:
              for candidate_name, udid in candidates:
                  if candidate_name == name:
                      print(udid)
                      sys.exit(0)
          if candidates:
              print(candidates[0][1])
              sys.exit(0)
          raise SystemExit("No available iOS 27 iPhone simulator found")
          PY
          UDID="$(cat /tmp/pm-sim-udid.txt)"
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build simulator target
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee simulator-build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -sdk iphonesimulator \
            -destination \
              "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -destination-timeout 60 \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' simulator-build.log test.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

      - name: Build unsigned iPhone application
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$PWD/build/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.25.0-unsigned.ipa"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$PWD/artifacts/PrivateMusic-3.25.0-unsigned.ipa" \
            --title "Private Music 3.25.0" \
            --notes-file - <<'EOF'
          Private Music 3.25.0

          - Сборка на Xcode 27 / iOS 27 SDK.
          - Исправлена ошибка шаринга PM-NSURLErrorDomain--1001: увеличены
            таймауты экспорта, один повтор при обрыве и понятное сообщение.
          - Во время «Поделиться» офлайн-загрузки и автокэш временно
            останавливаются и скрываются из интерфейса, чтобы не мешать
            передаче файла.
          - Пауза при снятии наушников / AirPods подтверждена по Apple
            Responding to audio route changes
            (routeChangeNotification + oldDeviceUnavailable) и Automatic
            Ear Detection.

          IPA не подписан. Перед установкой подпишите его собственным
          сертификатом.
          EOF

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: PrivateMusic-3.25.0-unsigned
          path: artifacts/PrivateMusic-3.25.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
