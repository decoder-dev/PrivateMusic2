name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Xcode 26.5)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -destination \
              "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' test.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

  build:
    name: Build IPA (Xcode 27)
    needs: test
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Prepare Metal toolchain
        run: sudo xcodebuild -downloadComponent MetalToolchain || true

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned iPhone and Watch applications
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            -archivePath "$PWD/build/PrivateMusic.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee release-build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' release-build.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

      - name: Validate embedded Apple Watch application
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          python3 scripts/validate_watch_bundle.py "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.28.25-unsigned.ipa"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v3.28.25"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<'EOF'
          # Private Music 3.28.25

          Релиз с `main`: меньше нагрева при EQ/spatial, новый shelf
          «Новые релизы», экран миксов и плейлист как у альбома.

          ## Производительность и нагрев
          - Realtime DSP-тап эквалайзера и spatial audio переведён на
            unsafe-указатели вместо Array-subscript в самом горячем пути
            — меньше нагрузки на аудио-поток и меньше нагрева
          - Пересчёт коэффициентов EQ при перетаскивании слайдеров
            throttled (~12 Гц) вместо частоты кадров UI

          ## Аудио
          - Смена tone-profile (например CarKit) больше не делает полный
            replace AVPlayerItem: EQ/spatial не пропадают на несколько
            секунд после смены маршрута

          ## Каталог и экраны
          - Полка «Новые релизы» на главной (best-effort из catalog.getAudio)
          - Тап по миксу открывает MixView; play на карточке — сразу в очередь
          - Экран плейлиста: крупная обложка и Listen, как у альбома
          - Меньше лишнего зазора под однострочными названиями на home cards

          ## Установка
          IPA не подписан. Перед установкой подпишите собственным сертификатом:
          сначала `PlugIns/PrivateMusicWatch.app`, затем основное iPhone-приложение.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$PWD/artifacts/PrivateMusic-3.28.25-unsigned.ipa" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Private Music 3.28.25" \
              --notes-file "$NOTES" \
              --prerelease=false \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              "$PWD/artifacts/PrivateMusic-3.28.25-unsigned.ipa" \
              --title "Private Music 3.28.25" \
              --notes-file "$NOTES" \
              --latest
          fi

      - name: Upload unsigned IPA
        if: success() || failure()
        uses: actions/upload-artifact@v5
        with:
          name: PrivateMusic-3.28.25-unsigned
          path: artifacts/PrivateMusic-3.28.25-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
