name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build simulator target
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee simulator-build.log

      - name: Run unit tests
        run: |
          SIMULATOR_ID="$(
            xcrun simctl list devices available -j |
            python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for devices in data.get("devices", {}).values():
              for device in devices:
                  if (
                      device.get("isAvailable")
                      and device.get("name", "").startswith("iPhone")
                  ):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator")
          '
          )"
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' simulator-build.log test.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

      - name: Build unsigned iPhone application
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$PWD/build/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.12.0-unsigned.ipa"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$PWD/artifacts/PrivateMusic-3.12.0-unsigned.ipa" \
            --title "Private Music 3.12.0" \
            --notes-file - <<'EOF'
          Private Music 3.12.0

          - нижняя навигация переведена на системный TabView Liquid Glass;
          - панель автоматически сворачивается при прокрутке на iOS 26.1+;
          - мини-плеер встроен через системный tabViewBottomAccessory;
          - мини-плеер адаптируется между expanded и inline-компоновками;
          - контент корректно проходит под плавающей навигацией;
          - кнопки плеера получили интерактивный clear/regular Liquid Glass;
          - iOS 16–26.0 сохраняют совместимый material-fallback;
          - сохранены чёрная и белая темы, VoiceOver и Reduce Motion.

          IPA не подписан. Перед установкой подпишите его собственным
          сертификатом.
          EOF

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: PrivateMusic-3.12.0-unsigned
          path: artifacts/PrivateMusic-3.12.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
