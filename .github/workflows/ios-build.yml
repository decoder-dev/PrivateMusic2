name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

# Prefer the latest push/PR head — a backlog of superseded Selena
# polish commits was starving macOS runners for 50+ minutes.
concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Xcode 26.5)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -destination \
              "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' test.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

  build:
    name: Build IPA (Xcode 27)
    needs: test
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Prepare Metal toolchain
        run: sudo xcodebuild -downloadComponent MetalToolchain || true

      # project.yml is the single source of truth for the version. It used
      # to be hard-coded in ~11 places in this file, so every bump meant
      # editing all of them and one miss shipped a mismatched artifact.
      - name: Resolve version
        run: |
          VERSION="$(awk '/^ *MARKETING_VERSION:/ {print $2; exit}' project.yml)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $VERSION"

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned iPhone and Watch applications
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            -archivePath "$PWD/build/PrivateMusic.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee release-build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' release-build.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

      - name: Validate embedded Apple Watch application
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          python3 scripts/validate_watch_bundle.py "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          mkdir -p artifacts
          # Full IPA (iPhone + Watch) — Apple unsigned recipe via Info-ZIP.
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-$VERSION-unsigned.ipa"
          # iPhone-only IPA — for ESign / Sideloadly / Feather that choke on
          # embedded Watch PlugIns during import/unpack/resign.
          bash ./scripts/package_unsigned_ipa.sh --strip-watch \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-$VERSION-iphone-unsigned.ipa"

      # Publishes straight off main once tests + archive pass: the tag is
      # created by `gh release create` on this commit, so no separate tag
      # push is needed. A version that already has a release only gets its
      # assets refreshed — the tag keeps pointing at the commit that first
      # shipped it, and existing download links stay valid. Bump
      # MARKETING_VERSION to cut a new one.
      # The home-stage branch publishes too, under its own fixed tag. An
      # Actions artifact is a zip that only a signed-in browser can fetch,
      # which makes installing a test build on a phone needlessly painful;
      # a pre-release hands over the .ipa directly. It never carries a
      # `v*` tag, is never marked latest, and is replaced wholesale on
      # every push so the tag tracks the branch head instead of freezing
      # on the first build.
      - name: Publish GitHub release
        if: >-
          github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/claude/home-stage' ||
          startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The releases API answers 503 often enough that a single blip
          # otherwise throws away a green archive and costs a full rebuild.
          retry() {
            attempt=1
            until "$@"; do
              if [ "$attempt" -ge 4 ]; then
                echo "::error::$* failed after $attempt attempts"
                return 1
              fi
              echo "Attempt $attempt failed, retrying in $((attempt * 10))s"
              sleep "$((attempt * 10))"
              attempt=$((attempt + 1))
            done
          }
          ASSETS=(
            "$PWD/artifacts/PrivateMusic-$VERSION-iphone-unsigned.ipa"
            "$PWD/artifacts/PrivateMusic-$VERSION-unsigned.ipa"
          )
          if [ "$GITHUB_REF" = "refs/heads/claude/home-stage" ]; then
            PREVIEW_TAG="home-stage-preview"
            PREVIEW_NOTES="$(mktemp)"
            cat > "$PREVIEW_NOTES" <<'EOF'
          Превью ветки `claude/home-stage`. Собирается заново на каждый
          push, тег всегда указывает на последний коммит ветки.

          ## Сцена на Главной
          Главная открывается тем, что играет: контекст очереди чипом,
          исполнитель крупно, обложка, «пауза · название · лайк» и лента
          подборок-пузырей. Полки — «Новые релизы», «Недавно слушали»,
          «Миксы», «Плейлисты» — остаются ниже без изменений.

          Пузыри строятся из того, что приложение уже знает: станция
          Селены, выбранный вайб, исполнители из недавнего и миксы VK с
          фото кураторов в аватарах.

          Выключается в Настройках → Оформление → «Сцена на Главной».

          ## Установка
          IPA не подписан.
          - **`…-iphone-unsigned.ipa`** — без Watch
          - `…-unsigned.ipa` — полная сборка с Watch
          EOF
            gh release delete "$PREVIEW_TAG" --yes --cleanup-tag \
              >/dev/null 2>&1 || true
            gh api -X DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$PREVIEW_TAG" \
              >/dev/null 2>&1 || true
            retry gh release create "$PREVIEW_TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Сцена на Главной · превью ($VERSION)" \
              --notes-file "$PREVIEW_NOTES" \
              --prerelease \
              --latest=false
            exit 0
          fi
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION"
            exit 1
          fi
          NOTES="$(mktemp)"
          cat > "$NOTES" <<'EOF'
          # Private Music 3.28.84 (pre-release)

          Полоса прогресса налезала на рамку мини-плеера.

          ## Нижняя панель в старом режиме
          - Полоса прогресса рисовалась вплотную к нижней грани карточки —
            ровно там, где идёт обводка контейнера и начинается загиб
            углов (радиус 16 pt). Синяя линия ложилась на границу карточки
            и обрезалась углом: читалось как случайное наложение, а не как
            прогресс трека
          - Полоса отодвинута от нижнего края и от углов. Высота панели не
            изменилась — отступ взят из внутреннего промежутка, док не
            стал выше
          - Добавлены проверки на геометрию: полоса обязана начинаться за
            радиусом угла и не касаться обводки, а суммарная высота
            карточки — не расти

          ## Установка
          IPA не подписан.
          - **`…-iphone-unsigned.ipa`** — без Watch
          - `…-unsigned.ipa` — полная сборка с Watch
          EOF
          # Heredoc is quoted so backticks in the notes stay literal;
          # patch the version into the title afterwards.
          sed -i '' "1s|.*|# Private Music $VERSION (pre-release)|" "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — refreshing assets and notes"
            retry gh release upload "$TAG" "${ASSETS[@]}" --clobber
            retry gh release edit "$TAG" \
              --title "Private Music $VERSION" \
              --notes-file "$NOTES" \
              --draft=false \
              --prerelease
          else
            echo "Creating release $TAG on $GITHUB_SHA"
            retry gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Private Music $VERSION" \
              --notes-file "$NOTES" \
              --prerelease
          fi

      - name: Upload unsigned IPA
        if: success() || failure()
        uses: actions/upload-artifact@v5
        with:
          name: PrivateMusic-${{ env.VERSION }}-unsigned
          path: |
            artifacts/PrivateMusic-${{ env.VERSION }}-iphone-unsigned.ipa
            artifacts/PrivateMusic-${{ env.VERSION }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
