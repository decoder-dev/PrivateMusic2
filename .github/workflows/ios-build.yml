name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Xcode 26.5)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -destination \
              "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' test.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

  build:
    name: Build IPA (Xcode 27)
    needs: test
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Prepare Metal toolchain
        run: sudo xcodebuild -downloadComponent MetalToolchain || true

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned iPhone and Watch applications
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            -archivePath "$PWD/build/PrivateMusic.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee release-build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' release-build.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

      - name: Validate embedded Apple Watch application
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          python3 scripts/validate_watch_bundle.py "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.28.23-unsigned.ipa"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v3.28.23"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<'EOF'
          # Private Music 3.28.23

          Релиз с `main`: стабильное аудио в авто, системная громкость,
          мини-плеер как в Apple Music и меньше нагрева.

          ## Аудио и авто
          - На слабой сети трек ретраится несколько раз (refresh URL + reload) вместо мгновенного skip на 5-й/10-й песне
          - Буфер вперёд ~30с; долгий stall сам запускает восстановление потока
          - Эквалайзер и пространственный звук идут через локальный decode на iPhone и доходят до наушников, колонок и CarKit / Bluetooth
          - Громкость только системная (`MPVolumeView`), без отдельного app-level attenuation
          - После media-services reset при подключении к машине воспроизведение продолжается
          - Tap EQ/spatial ставится только после `readyToPlay` и на audio track; HLS без unsupported tap — без каскада ошибок и skip
          - Flat EQ не включает realtime tap; меньше CPU на external route

          ## Мини-плеер
          - Компактная glass-панель: обложка, title/artist, play/pause, next, прогресс
          - iOS 26.1+: expanded / inline tab accessory без обрезания
          - Настоящий crossfade обложек
          - Жесты с axis dominance — диагональ не дергает UI

          ## Производительность
          - Прогресс вынесен из EnvironmentObject — списки не дёргаются от тиков плеера
          - Coalesce remote commands, тихий early-out в EQ DSP
          - Меньше artwork prefetch / Watch / persist нагрузки

          ## Интерфейс и платформа
          - System TabView + search role на iOS 26.1+, legacy dock на iOS 16–26.0
          - iOS 27 scene lifecycle и актуальные privacy reasons
          - В «Сейчас играет» для истории: **История прослушивания**, а не «Микс по …»
          - Исправлена пустая вкладка «Треки» в библиотеке

          ## Установка
          IPA не подписан. Перед установкой подпишите собственным сертификатом:
          сначала `PlugIns/PrivateMusicWatch.app`, затем основное iPhone-приложение.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$PWD/artifacts/PrivateMusic-3.28.23-unsigned.ipa" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Private Music 3.28.23" \
              --notes-file "$NOTES" \
              --prerelease=false \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              "$PWD/artifacts/PrivateMusic-3.28.23-unsigned.ipa" \
              --title "Private Music 3.28.23" \
              --notes-file "$NOTES" \
              --latest
          fi

      - name: Upload unsigned IPA
        if: success() || failure()
        uses: actions/upload-artifact@v5
        with:
          name: PrivateMusic-3.28.23-unsigned
          path: artifacts/PrivateMusic-3.28.23-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
