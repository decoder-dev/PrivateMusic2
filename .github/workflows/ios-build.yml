name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build simulator target
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee simulator-build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -sdk iphonesimulator \
            -destination \
              "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' simulator-build.log test.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

      - name: Build unsigned iPhone application
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$PWD/build/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.23.4-unsigned.ipa"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$PWD/artifacts/PrivateMusic-3.23.4-unsigned.ipa" \
            --title "Private Music 3.23.4" \
            --notes-file - <<'EOF'
          Private Music 3.23.4

          Офлайн-загрузки переработаны:
          - Скачивание больших плейлистов: теперь загружаются все треки
            (до 1000), пагинация идёт автоматически.
          - Наглядные состояния: «подготовка», «в очереди», «скачивание»,
            «частично скачан», «отменён» и понятные сообщения об ошибках.
          - Единая очередь загрузок: повторный запуск не дублирует работу,
            до трёх плейлистов качаются одновременно.
          - Стабильный счётчик скачанного — файлы на диске являются
            источником истины, «фантомные» записи исчезают сами.
          - Перезапуск отменённой загрузки начинается с чистого состояния.
          - Скачивание внутри «Медиатеки» показывает актуальный прогресс
            в списках и в бейдже вкладки.
          - Всё привязано к аккаунту: после смены пользователя чужие
            загрузки не показываются.

          Надёжность и тесты:
          - Автотесты на CI больше не пропускают ошибки сборки тестового
            таргета (исправлен пайплайн), исправлены застаревшие тесты,
            добавлены тесты офлайн-очереди, пагинации и хранения.
          - Манифесты хранятся с точным временем обновления — повторное
            открытие приложения не расходится с записанным состоянием.

          IPA не подписан. Перед установкой подпишите его собственным
          сертификатом.
          EOF

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: PrivateMusic-3.23.4-unsigned
          path: artifacts/PrivateMusic-3.23.4-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
