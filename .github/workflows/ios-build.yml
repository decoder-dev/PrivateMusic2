name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Xcode 26.5)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -destination \
              "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' test.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

  build:
    name: Build IPA (Xcode 27)
    needs: test
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Prepare Metal toolchain
        run: sudo xcodebuild -downloadComponent MetalToolchain || true

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned iPhone and Watch applications
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            -archivePath "$PWD/build/PrivateMusic.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee release-build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' release-build.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

      - name: Validate embedded Apple Watch application
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          python3 scripts/validate_watch_bundle.py "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          mkdir -p artifacts
          # Full IPA (iPhone + Watch) — Apple unsigned recipe via Info-ZIP.
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.28.72-unsigned.ipa"
          # iPhone-only IPA — for ESign / Sideloadly / Feather that choke on
          # embedded Watch PlugIns during import/unpack/resign.
          bash ./scripts/package_unsigned_ipa.sh --strip-watch \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.28.72-iphone-unsigned.ipa"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v3.28.72"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<'EOF'
          # Private Music 3.28.72 (pre-release)

          Полка «Плейлисты» в Медиатеке показывает все плейлисты, а не
          один.

          ## Плейлисты
          - Настоящая причина «они не все»: полка вычитала из списка
            плейлистов все идентификаторы, которые прислала полка
            «Альбомы». В 3.28.70 эту вычитку убрали, но одно место
            осталось — Медиатека перефильтровывала полку каждый раз,
            когда полка «Альбомы» публиковала свой список. Плейлисты
            загружались все, а потом приходили альбомы и снимали с полки
            почти всё
          - Вычитки больше нет нигде: ни в политике полки, ни во
            вью-модели, ни в самом экране. Что бы полка «Альбомы» ни
            приняла за релиз — и что бы VK ни ответил на
            `filters=albums`, если решит его не соблюдать, — плейлист с
            Медиатеки это уже не уберёт
          - Отдельно чинит случай, когда сессия восстановлена раньше
            профиля: без идентификатора владельца вычитка снимала и ваши
            собственные плейлисты
          - Релизы по-прежнему отсеиваются по самой записи: только то,
            что VK сам пометил как релиз (`album_type`) и подтвердил
            вторым признаком. Релиз, который проскочит, — это лишняя
            рабочая карточка, а вычтенный плейлист — это и есть дефект
          - «Мне нравится (2)» снова отдельная карточка: VK выдаёт
            пронумерованную копию, когда «Мне нравится» сохраняют ещё
            раз, и у неё свой идентификатор и свои треки. Схлопываются
            только ваша и чужая копии одного и того же «Мне нравится»
          - Прошлые исправления остались на месте: страница собирается
            из всех блоков ответа, «Альбомы» просят `filters=albums`,
            а плейлист без названия по-прежнему виден

          ## Наушники
          - Отключение наушников поднимает и прерывание, и смену
            маршрута, и порядок между ними не гарантирован. Если
            прерывание приходило первым, оно уже ставило паузу и снимало
            признак воспроизведения — смена маршрута считала, что играть
            нечего, и музыка уходила в динамик
          - Потеря маршрута теперь определяется по самому маршруту, а
            пауза ставится безусловно
          - Отложенное возобновление после прерывания дольше ждёт, пока
            маршрут устоится, и перед стартом ещё раз проверяет его: если
            наушников уже нет, возобновление откладывается до следующего
            устройства, а не звучит из динамика

          ## Очередь
          - Запуск из Медиатеки подписан «Ваши треки», а не миксом по
            нажатому треку
          - В шапке «Треки» появилась кнопка «Перемешать»: она
            перемешивает только свою очередь и не трогает настройку, так
            что следующее нажатие на строку снова играет по порядку
          - Нажатие на трек в Медиатеке по-прежнему ставит в очередь
            видимый список в видимом порядке и продолжается следующей
            страницей библиотеки

          ## Установка
          IPA не подписан.
          - **`…-iphone-unsigned.ipa`** — без Watch
          - `…-unsigned.ipa` — полная сборка с Watch
          EOF
          ASSETS=(
            "$PWD/artifacts/PrivateMusic-3.28.72-iphone-unsigned.ipa"
            "$PWD/artifacts/PrivateMusic-3.28.72-unsigned.ipa"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Private Music 3.28.72" \
              --notes-file "$NOTES" \
              --draft=false \
              --prerelease
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "Private Music 3.28.72" \
              --notes-file "$NOTES" \
              --prerelease
          fi

      - name: Upload unsigned IPA
        if: success() || failure()
        uses: actions/upload-artifact@v5
        with:
          name: PrivateMusic-3.28.72-unsigned
          path: |
            artifacts/PrivateMusic-3.28.72-iphone-unsigned.ipa
            artifacts/PrivateMusic-3.28.72-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
