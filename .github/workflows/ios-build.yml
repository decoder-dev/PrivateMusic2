name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Validate source package
        run: python3 scripts/validate_project.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build simulator target
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee simulator-build.log
      - name: Run unit tests
        run: |
          SIMULATOR_ID="$(
            xcrun simctl list devices available -j |
            python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for devices in data.get("devices", {}).values():
              for device in devices:
                  if (
                      device.get("isAvailable")
                      and device.get("name", "").startswith("iPhone")
                  ):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator")
          '
          )"
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log
      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' simulator-build.log test.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done
          {
            echo '```text'
            grep -E '(^| )(error|warning):' simulator-build.log test.log \
              | tail -100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build unsigned iPhone application
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$PWD/build/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.7.0-unsigned.ipa"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$PWD/artifacts/PrivateMusic-3.7.0-unsigned.ipa" \
            --title "Private Music 3.7.0" \
            --notes-file - <<'EOF'
          Private Music 3.7.0

          - все запросы используют единый центр восстановления VK-сессии;
          - параллельные ошибки авторизации запускают только один cookie refresh;
          - новый вход и выход защищены от результата устаревшего refresh;
          - временный отказ VK больше не объявляет сессию недействительной;
          - автопродолжение очереди выполняется одним запросом с безопасным retry;
          - устаревший ответ рекомендаций не меняет уже переключённый трек;
          - позиция и длительность сбрасываются до загрузки следующего трека;
          - ошибки фонового продолжения не открывают конфликтующее модальное окно;
          - все окна плеера сведены к одной согласованной sheet-презентации;
          - меню действий больше не мигает и не пересоздаётся при каждом открытии;
          - устранены двойные анимации и мерцание кэшированных обложек;
          - свайпы и нажатия стали мягче и корректно учитывают Reduce Motion;
          - добавлены регрессионные тесты гонок очереди и переноса прогресса;
          - нижние быстрые действия закреплены у нижней safe area;
          - свободное пространство перенесено перед рядом действий;
          - время и длительность атомарно сбрасываются при смене трека;
          - старый AVPlayerItem больше не может обновить прогресс нового трека;
          - snapshot нового трека всегда сохраняется с правильной позицией;
          - добавлен регрессионный тест переноса времени между треками;
          - нижний ряд действий плеера опущен и получил больше воздуха;
          - кнопка сердца теперь добавляет и удаляет трек из медиатеки;
          - удаление работает даже для копии трека из плейлиста или микса;
          - системное мигающее меню заменено стабильной собственной панелью;
          - рядом с меню добавлен системный AirPlay route picker;
          - парсер Genius извлекает все вложенные контейнеры текста целиком;
          - добавлен тест полного текста с несколькими куплетами и вложенными div;
          - единичный отказ обновления больше не объявляет сессию истёкшей;
          - рабочий токен сохраняется во время фонового восстановления;
          - проверка неизвестного срока сессии выполняется каждые 15 минут;
          - повторное обновление продолжает работать после временного отказа VK;
          - добавлено продолжение воспроизведения при подключении Bluetooth;
          - поддержаны Bluetooth A2DP, HFP и LE-аудиоустройства;
          - добавлена автоматическая пауза при системной громкости ноль;
          - минимальная громкость проверяется также при запуске трека;
          - обе функции сохраняются между запусками и управляются в настройках;
          - добавлены unit-тесты политики Bluetooth-маршрутов и громкости;
          - карточка подключения больше не растягивает пустую область;
          - Wi‑Fi и мобильная сеть считаются полноценными подключениями;
          - сетевой слой явно разрешает cellular и ограниченные соединения;
          - диагностика показывает фактический тип активной сети;
          - плеер получил более свободные вертикальные интервалы;
          - на высоких iPhone элементы слегка опущены и не сбиваются в кучу;
          - исправлен сброс веб-сессии после полного закрытия приложения;
          - токен без объявленного срока сначала проверяется через VK API;
          - cookie-refresh запускается только после error 5 или известного истечения;
          - User-Agent музыкального токена сохраняется неизменным в Keychain;
          - сессия и профиль доступны после первого разблокирования устройства;
          - добавлена защита от параллельной проверки одной сессии;
          - добавлены тесты холодного запуска и стратегии обновления токена;
          - полноэкранный плеер полностью перестроен по премиальному UI-промту;
          - устранена огромная пустота между верхней панелью и обложкой;
          - обложка, метаданные, прогресс и controls получили строгую иерархию;
          - уменьшены верхние кнопки, типографика и основные элементы управления;
          - тяжёлые нижние плитки заменены компактными быстрыми действиями;
          - стандартный крупный Slider заменён точным компактным скраббером;
          - скраббер получил небольшой thumb и корректное непрерывное перемещение;
          - глобальный свайп закрытия удалён, чтобы не конфликтовать с controls;
          - жесты смены трека, очереди и закрытия сохранены только на обложке;
          - фон и новая обложка меняются плавно без чёрного промежуточного кадра;
          - компоновка адаптирована для компактных и крупных экранов iPhone;
          - сохранены Reduce Motion, Dynamic Type и доступность системного скраббера;
          - подключение VK переработано для длительной стабильной работы;
          - временная потеря сети больше не блокирует приложение и не удаляет сессию;
          - восстановление токена выполняется в фоне без замены основного интерфейса;
          - при возвращении сети подключение восстанавливается автоматически;
          - добавлены контролируемые повторы с экспоненциальной задержкой;
          - чтения безопасно повторяются, а изменения медиатеки выполняются один раз;
          - устранён риск двойного добавления треков и повторных изменений плейлистов;
          - отменённые запросы никогда не перезапускаются;
          - ошибки отсутствия сети и тайм-аута получили отдельную обработку;
          - обновлённые VK cookie сохраняются вместе с новым токеном;
          - профиль и owner ID кэшируются в Keychain и доступны без сети;
          - сессии без срока действия периодически проверяются и обновляются;
          - в настройках добавлена диагностика сети, сессии и срока обновления;
          - добавлены unit-тесты политик повторов, срока сессии и ротации cookie;
          - IPA полностью пересобран из чистой Release-сборки;
          - архив переведён в максимально совместимый ZIP Store-режим;
          - устранена несовместимость со старыми распаковщиками ESign/Scarlet;
          - структура Payload и каждый файл проверяются перед публикацией;
          - полноэкранный плеер получил компактную современную компоновку;
          - очередь, текст, плейлисты и экспорт доступны без открытия меню;
          - плеер показывает позицию текущего трека в очереди;
          - мини-плеер получил кнопки назад, пауза/воспроизведение и вперёд;
          - добавлен источник текстов Genius с обязательной атрибуцией;
          - при недоступности автоматической загрузки доступен переход на Genius;
          - VK и LRCLIB остаются надёжными запасными источниками текстов;
          - включён ProMotion и частота интерфейса до 120 Гц на поддерживаемых iPhone;
          - добавлены плавные переходы вкладок, карточек, обложек и мини-плеера;
          - анимации автоматически упрощаются при включённом «Уменьшении движения»;
          - обложки плейлистов получили заметную маркировку источника VK Музыка;
          - карточка плейлиста теперь показывает сервис, откуда он импортирован;
          - «Поделиться» экспортирует сам аудиофайл, а не текстовую ссылку;
          - перед экспортом приложение обновляет истёкшую ссылку VK;
          - поддержан экспорт обычных аудиофайлов и сборка HLS-потока в M4A;
          - временные экспортированные файлы удаляются после закрытия меню;
          - устранено мерцание обложек при загрузке из памяти и сети;
          - единый непрозрачный dock объединяет мини-плеер и навигацию;
          - вкладки сохраняют своё состояние при переключении;
          - медиатека, плейлисты и поиск получили бесконечную пагинацию;
          - снят прежний лимит отображения первых 100 треков;
          - общий индекс медиатеки корректно определяет добавленные копии VK;
          - карточки VK-миксов собираются из настоящих обложек треков;
          - добавлены unit-тесты нормализации очереди и индекса медиатеки;
          - CI теперь обязательно запускает тесты на iOS Simulator;
          - устранено визуальное просвечивание контента под мини-плеером;
          - мини-плеер и панель вкладок теперь имеют раздельный плотный фон;
          - Главная получила компактную шапку и уменьшенные карточки;
          - нижний контент корректно учитывает высоту обоих системных слоёв;
          - мини-плеер теперь всегда расположен над панелью вкладок;
          - уменьшены шрифты, обложки и элементы управления;
          - медиатека получила компактную навигацию и более плотный список;
          - полноэкранный плеер стал легче и пропорциональнее;
          - масштаб текста больше не наследует экстремальные системные значения;
          - новая навигация: Главная, Медиатека, Поиск и Профиль;
          - полноценная Главная с историей, VK-миксами, рекомендациями и плейлистами;
          - автоматический запасной источник рекомендаций через персональный VK-микс;
          - восстановление очереди и позиции без использования просроченных аудиоссылок;
          - автоматическое обновление ссылки VK перед продолжением воспроизведения;
          - защита от устаревших событий AVPlayer и ложной ошибки Canceled;
          - устранены двойные переходы и гонки продолжения очереди;
          - выбор трека в очереди больше не уничтожает очередь и её источник;
          - стабильная фоновая аудиосессия без ложной ошибки -50;
          - корректная пауза при отключении наушников и восстановление после прерываний;
          - надёжное сохранение VK-сессии через атомарное обновление Keychain;
          - отменённые сетевые запросы больше не повторяются и не показываются как ошибки;
          - поиск защищён от устаревшей выдачи и скачков индикатора загрузки;
          - адаптивные скелетоны и мини-плеер без горизонтального растягивания интерфейса;
          - корректные метаданные экрана блокировки: трек, исполнитель, альбом и обложка;
          - улучшено сопоставление текстов песен по длительности;
          - подтверждение перед выходом и полная остановка плеера после выхода;
          - новая минималистичная чёрная иконка;
          - настройка масштаба текста: компактный, системный и крупные уровни;
          - локальная история прослушиваний с поиском и очисткой;
          - синхронные тексты с автопрокруткой и переходом к строке;
          - 10-полосный эквалайзер с предусилителем и пресетами.

          IPA не подписан. Перед установкой его необходимо подписать своим
          сертификатом через ESign, Scarlet, AltStore или другой инструмент.
          EOF
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: PrivateMusic-3.7.0-unsigned
          path: artifacts/PrivateMusic-3.7.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
