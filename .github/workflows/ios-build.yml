name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Xcode 26.5)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Apple Watch remote
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusicWatch \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee watch-build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -destination \
              "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' watch-build.log test.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

  build:
    name: Build IPA (Xcode 27)
    needs: test
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Prepare Metal toolchain
        run: sudo xcodebuild -downloadComponent MetalToolchain || true

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned iPhone and Watch applications
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            -archivePath "$PWD/build/PrivateMusic.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee release-build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' release-build.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

      - name: Validate embedded Apple Watch application
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          python3 scripts/validate_watch_bundle.py "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.28.9-unsigned.ipa"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v3.28.9"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<'EOF'
          Private Music 3.28.9

          - Плеер: пункт меню "Настройки звука" убран как бесполезный —
            вместо него строка "Эквалайзер" теперь сама открывает полный
            экран настроек эквалайзера (профили, предусилитель, полосы
            частот) с тем же переключателем вкл/выкл внутри.
          - Исполнитель: список треков больше не выводится плоским списком —
            превью первых 16 треков показывается сеткой (4 на 4, с
            горизонтальной прокруткой) с кнопкой "Все" для полного списка.
            Альбомы исполнителя показываются сразу под треками.
          - Ветки: удалены все неактуальные cursor/* ветки на GitHub,
            остаётся одна рабочая ветка main.

          IPA не подписан. Перед установкой подпишите его собственным
          сертификатом. Подпись требует сначала подписать PlugIns/PrivateMusicWatch.app,
          затем основное приложение iPhone.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$PWD/artifacts/PrivateMusic-3.28.9-unsigned.ipa" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Private Music 3.28.9" \
              --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" \
              "$PWD/artifacts/PrivateMusic-3.28.9-unsigned.ipa" \
              --title "Private Music 3.28.9" \
              --notes-file "$NOTES"
          fi

      - name: Upload unsigned IPA
        if: success() || failure()
        uses: actions/upload-artifact@v5
        with:
          name: PrivateMusic-3.28.9-unsigned
          path: artifacts/PrivateMusic-3.28.9-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
