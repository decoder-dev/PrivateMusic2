name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

# Prefer the latest push/PR head — a backlog of superseded
# polish commits was starving macOS runners for 50+ minutes.
concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --reporter github-actions-logging

  native:
    name: Rust native core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Compiles the original C reference and checks the Rust implementation
      # against it bit for bit, then runs the crate's own tests.
      - name: Test
        run: cargo test --release --locked --manifest-path native/Cargo.toml

  test:
    name: Unit tests (Xcode 26.5)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py
          python3 scripts/validate_artwork.py
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -destination \
              "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      # Optional profiler recording: CPU/memory performance tests also run in
      # the required suite above. A host that disallows Instruments must not
      # hide their result or block packaging.
      - name: Record focused simulator CPU profile
        if: success()
        continue-on-error: true
        run: |
          set -o pipefail
          set +e
          xcrun xctrace record --template 'Time Profiler' --all-processes \
            --time-limit 60s --output Performance.trace > profiling-trace.log 2>&1 &
          trace_pid=$!
          xcodebuild -project PrivateMusic.xcodeproj -scheme PrivateMusic \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -parallel-testing-enabled NO -enableCodeCoverage NO \
            -only-testing:PrivateMusicTests/ResourceProfilingTests \
            -resultBundlePath PerformanceResults.xcresult \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee profiling-tests.log
          test_status=$?
          wait "$trace_pid"
          trace_status=$?
          printf 'performance_test_exit=%s\ntrace_exit=%s\n' "$test_status" "$trace_status" > profiling-status.txt
          if [ "$trace_status" -eq 0 ]; then
            xcrun xctrace export --input Performance.trace --toc --output profiling-toc.xml
            xcrun xctrace export --input Performance.trace \
              --xpath '/trace-toc/run/data/table[@schema="time-profile"]' \
              --output profiling-samples.xml >> profiling-trace.log 2>&1
          fi
          exit "$test_status"

      - name: Upload profiling evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: PrivateMusic-performance-evidence
          path: |
            Performance.trace/
            PerformanceResults.xcresult/
            profiling-*.log
            profiling-*.xml
            profiling-status.txt
          if-no-files-found: ignore
          retention-days: 14

      # Advisory reporting: must never fail the gate itself.
      - name: Export visual review evidence
        if: success() || failure()
        continue-on-error: true
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path DesignSnapshots
          fi

      - name: Upload test and design evidence
        if: success() || failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: PrivateMusic-test-evidence
          path: |
            DesignSnapshots/
            test.log
          retention-days: 14

      - name: Report coverage and retried tests
        if: success() || failure()
        continue-on-error: true
        run: |
          {
            echo "### Unit test report"
            echo
            if [ -d TestResults.xcresult ]; then
              echo "#### Coverage by target"
              echo '```'
              xcrun xccov view --report --only-targets TestResults.xcresult
              echo '```'
            fi
            retried="$(grep -E "Test Case .* failed" test.log | sort -u || true)"
            if [ -n "$retried" ]; then
              echo "#### Failed at least once (retried or still failing)"
              echo '```'
              echo "$retried"
              echo '```'
              echo "::warning::Some tests failed on a first attempt; -retry-tests-on-failure may be hiding flakiness"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' test.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

  build:
    name: Build IPA (Xcode 27)
    needs: [lint, test, native]
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Prepare Metal toolchain
        run: sudo xcodebuild -downloadComponent MetalToolchain || true

      # project.yml is the single source of truth for the version. It used
      # to be hard-coded in ~11 places in this file, so every bump meant
      # editing all of them and one miss shipped a mismatched artifact.
      - name: Resolve version
        run: |
          VERSION="$(awk '/^ *MARKETING_VERSION:/ {print $2; exit}' project.yml)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $VERSION"

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py
          python3 scripts/validate_artwork.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned iPhone and Watch applications
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            -archivePath "$PWD/build/PrivateMusic.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee release-build.log

      - name: Validate and package dSYMs
        run: |
          python3 scripts/package_debug_symbols.py \
            "$PWD/build/PrivateMusic.xcarchive" \
            "$PWD/artifacts/PrivateMusic-$VERSION-$GITHUB_SHA-dSYMs.zip" \
            --commit "$GITHUB_SHA"

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' release-build.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

      - name: Validate embedded Apple Watch application
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          python3 scripts/validate_watch_bundle.py "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          mkdir -p artifacts
          # Full IPA (iPhone + Watch) — Apple unsigned recipe via Info-ZIP.
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-$VERSION-unsigned.ipa"
          # iPhone-only IPA — for ESign / Sideloadly / Feather that choke on
          # embedded Watch PlugIns during import/unpack/resign.
          bash ./scripts/package_unsigned_ipa.sh --strip-watch \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-$VERSION-iphone-unsigned.ipa"

      # Publishes straight off main once tests + archive pass: the tag is
      # created by `gh release create` on this commit, so no separate tag
      # push is needed. Published versions are immutable: a rerun must not
      # replace IPA/dSYM files or demote a stable release to pre-release.
      # Bump MARKETING_VERSION to publish different application binaries.
      # An Actions artifact is a zip
      # that only a signed-in browser can fetch; a pre-release hands over
      # the .ipa directly.
      - name: Publish GitHub release
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The releases API answers 503 often enough that a single blip
          # otherwise throws away a green archive and costs a full rebuild.
          retry() {
            attempt=1
            until "$@"; do
              if [ "$attempt" -ge 4 ]; then
                echo "::error::$* failed after $attempt attempts"
                return 1
              fi
              echo "Attempt $attempt failed, retrying in $((attempt * 10))s"
              sleep "$((attempt * 10))"
              attempt=$((attempt + 1))
            done
          }
          ASSETS=(
            "$PWD/artifacts/PrivateMusic-$VERSION-iphone-unsigned.ipa"
            "$PWD/artifacts/PrivateMusic-$VERSION-unsigned.ipa"
            "$PWD/artifacts/PrivateMusic-$VERSION-$GITHUB_SHA-dSYMs.zip"
          )
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION"
            exit 1
          fi
          NOTES="$(mktemp)"
          cat > "$NOTES" <<'EOF'
          # Private Music 3.30.16 (pre-release)

          ## Надёжность и безопасность
          - Приложение больше не падает, если сервер пришлёт некорректный
            заголовок Retry-After (например, «nan»): задержка повтора
            считается безопасно.
          - Запросы к API привязаны к хосту VK по https и не следуют
            редиректам на другие хосты, чтобы токен не мог уйти на чужой адрес.
          - Некорректное время воспроизведения (NaN/бесконечность) больше не
            может уронить приложение, в том числе при запуске.
          - Журнал скрывает подписанные ссылки, идентификаторы сессий, секреты
            и Bearer-значения, так что логи безопаснее отправлять.
          - Окно Genius открывает только https-страницы.

          ## Тексты песен (Genius)
          - Исправлен поиск текстов, добавлено видимое восстановление при
            сбое Genius и проверка настоящих контейнеров текста.

          ## Интерфейс и данные
          - Подписи в профиле читаются при крупном размере текста, а
            многострочные строки получили отступы.
          - Неудачное сохранение статистики прослушивания не теряется, а
            остановленный импорт плейлиста сообщает об этом.

          ## Установка и проверка
          IPA не подписан.
          - **`…-iphone-unsigned.ipa`** — iPhone и виджет, без Watch.
          - `…-unsigned.ipa` — iPhone, виджет и Watch.
          - `…-dSYMs.zip` — соответствующие символы отладки.
          Для обмена данными с виджетом подпись приложения и расширения должна
          поддерживать App Group `group.com.dec.privatemusic2`.
          Сборка проверяется в симуляторе на тестовых данных. Живая сессия VK,
          воспроизведение HLS и работа виджета требуют отдельной проверки
          на устройстве.
          EOF
          # Heredoc is quoted so backticks in the notes stay literal;
          # patch the version into the title afterwards.
          sed -i '' "1s|.*|# Private Music $VERSION (pre-release)|" "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; preserving its assets, notes and release status. New outputs are available as Actions artifacts. Bump MARKETING_VERSION for a new release."
          else
            echo "Creating release $TAG on $GITHUB_SHA"
            retry gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Private Music $VERSION" \
              --notes-file "$NOTES" \
              --prerelease
          fi

      - name: Upload unsigned IPA
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PrivateMusic-${{ env.VERSION }}-unsigned
          path: |
            artifacts/PrivateMusic-${{ env.VERSION }}-iphone-unsigned.ipa
            artifacts/PrivateMusic-${{ env.VERSION }}-unsigned.ipa
            artifacts/PrivateMusic-${{ env.VERSION }}-${{ github.sha }}-dSYMs.zip
          if-no-files-found: error
          retention-days: 14
