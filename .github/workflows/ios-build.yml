name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Validate source package
        run: python3 scripts/validate_project.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build simulator target
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee simulator-build.log
      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' simulator-build.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done
          {
            echo '```text'
            grep -E '(^| )(error|warning):' simulator-build.log \
              | tail -100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build unsigned iPhone application
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$PWD/build/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-2.8.0-unsigned.ipa"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$PWD/artifacts/PrivateMusic-2.8.0-unsigned.ipa" \
            --title "Private Music 2.8.0" \
            --notes-file - <<'EOF'
          Private Music 2.8.0

          - строгие светлая и тёмная монохромные темы;
          - новый главный экран с профессиональной визуальной иерархией;
          - реальные персональные рекомендации audio.getRecommendations;
          - каталог и потоковые миксы VK;
          - отменённые запросы больше не отображаются как ошибка;
          - без подмены рекомендаций случайными треками медиатеки.

          IPA не подписан. Перед установкой его необходимо подписать своим
          сертификатом через ESign, Scarlet, AltStore или другой инструмент.
          EOF
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: PrivateMusic-2.8.0-unsigned
          path: artifacts/PrivateMusic-2.8.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
