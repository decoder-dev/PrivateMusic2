name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Xcode 26.5)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -destination \
              "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' test.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

  build:
    name: Build IPA (Xcode 27)
    needs: test
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Prepare Metal toolchain
        run: sudo xcodebuild -downloadComponent MetalToolchain || true

      - name: Validate source package
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_localizations.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned iPhone and Watch applications
        run: |
          set -o pipefail
          xcodebuild \
            -project PrivateMusic.xcodeproj \
            -scheme PrivateMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            -archivePath "$PWD/build/PrivateMusic.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee release-build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '(^| )error:' release-build.log \
            | tail -30 \
            | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"
                safe="${safe//$'\r'/'%0D'}"
                safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Xcode compiler::$safe"
              done

      - name: Validate embedded Apple Watch application
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          python3 scripts/validate_watch_bundle.py "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/build/PrivateMusic.xcarchive/Products/Applications/PrivateMusic.app"
          test -d "$APP_PATH"
          bash ./scripts/package_unsigned_ipa.sh \
            "$APP_PATH" \
            "$PWD/artifacts/PrivateMusic-3.28.22-unsigned.ipa"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v3.28.22"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<'EOF'
          Private Music 3.28.22

          Сводка main после слияния всех открытых веток.

          Производительность
          - Прогресс воспроизведения вынесен из EnvironmentObject AudioPlayer —
            списки больше не перерисовываются 2 раза в секунду
          - Убраны дёргания прогресса мини-плеера и thrash safe-area дока
          - Coalesce remote commands; тихий early-out в EQ DSP
          - Меньше artwork prefetch / Watch / persist нагрузки

          Громкость / DSP
          - Слайдер громкости связан с системным звуком (MPVolumeView)
          - Эквалайзер и пространственный звук работают на наушниках,
            колонках и CarKit / Bluetooth автомобиля (локальный decode + tap)
          - EQ/spatial tap только после readyToPlay и с AVAssetTrack; HLS без
            tap (иначе item fails на авто), после media-reset нет skip-каскада

          Мини-плеер
          - Apple Music–style glass panel: обложка, title/artist, play/pause,
            next, тонкий прогресс; previous через свайп / VoiceOver
          - iOS 26.1+: expanded vs inline tab accessory (компактный inline
            без обрезания при minimize)
          - Настоящий crossfade обложек без мигания placeholder
          - Жесты с axisDominanceRatio — почти диагональ игнорируется

          Аудио / CarKit / нагрев
          - После media-services reset (часто при подключении к машине)
            воспроизведение восстанавливается, если оно было активно
          - Гонки interruption/route: нет утечки в динамик телефона,
            pending resume не теряется
          - Flat EQ не ставит realtime tap; меньше CPU и лучше external route
          - Меньше нагрева: без лишних @Published / Watch WCSession spam

          Также
          - System TabView + search role на iOS 26.1+
          - Исправление пустой вкладки «Треки» в библиотеке
          - Legacy dock для iOS 16–26.0
          - iOS 27 scene lifecycle + privacy reasons
          - История прослушивания в заголовке «Сейчас играет»

          IPA не подписан. Перед установкой подпишите его собственным
          сертификатом. Подпись требует сначала подписать PlugIns/PrivateMusicWatch.app,
          затем основное приложение iPhone.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$PWD/artifacts/PrivateMusic-3.28.22-unsigned.ipa" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Private Music 3.28.22" \
              --notes-file "$NOTES" \
              --prerelease
          else
            gh release create "$GITHUB_REF_NAME" \
              "$PWD/artifacts/PrivateMusic-3.28.22-unsigned.ipa" \
              --title "Private Music 3.28.22" \
              --notes-file "$NOTES" \
              --prerelease
          fi

      - name: Upload unsigned IPA
        if: success() || failure()
        uses: actions/upload-artifact@v5
        with:
          name: PrivateMusic-3.28.22-unsigned
          path: artifacts/PrivateMusic-3.28.22-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
