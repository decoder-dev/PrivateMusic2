name: PrivateMusic
options:
  bundleIdPrefix: com.dec
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.5"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 53
    MARKETING_VERSION: 3.23.0
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  PrivateMusic:
    type: application
    platform: iOS
    sources:
      - path: PrivateMusic
        excludes:
          - Resources/Info.plist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PrivateMusic/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.dec.privatemusic2
    scheme:
      testTargets:
        - PrivateMusicTests
  PrivateMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PrivateMusicTests
    dependencies:
      - target: PrivateMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dec.privatemusic2.tests
        GENERATE_INFOPLIST_FILE: YES
