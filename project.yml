name: PrivateMusic
options:
  bundleIdPrefix: com.dec
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 2.0.0
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  PrivateMusic:
    type: application
    platform: iOS
    sources:
      - path: PrivateMusic
        excludes:
          - Resources/Assets.xcassets
          - Resources/Info.plist
          - Resources/PrivacyInfo.xcprivacy
      - path: PrivateMusic/Resources/Assets.xcassets
        buildPhase: resources
      - path: PrivateMusic/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: PrivateMusic/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dec.privatemusic2
        PRODUCT_NAME: Private Music
    scheme:
      testTargets:
        - PrivateMusicTests
  PrivateMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PrivateMusicTests
    dependencies:
      - target: PrivateMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dec.privatemusic2.tests
        GENERATE_INFOPLIST_FILE: YES
