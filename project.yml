name: PrivateMusic
options:
  bundleIdPrefix: com.dec
  minimumXcodeGenVersion: 2.46.0
  postGenCommand: python3 scripts/fix_watch_embedding.py
  deploymentTarget:
    iOS: "16.0"
    watchOS: "10.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 106
    MARKETING_VERSION: 3.28.32
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  PrivateMusic:
    type: application
    platform: iOS
    sources:
      - path: PrivateMusic
        excludes:
          - Resources/Info.plist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PrivateMusic/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.dec.privatemusic2
    dependencies:
      - target: PrivateMusicWatch
        embed: true
    scheme:
      testTargets:
        - PrivateMusicTests
  PrivateMusicWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: PrivateMusicWatch
      - path: PrivateMusic/Shared/WatchRemoteProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dec.privatemusic2.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Private Music
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.dec.privatemusic2
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 4
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
    scheme: {}
  PrivateMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PrivateMusicTests
    dependencies:
      - target: PrivateMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dec.privatemusic2.tests
        GENERATE_INFOPLIST_FILE: YES
