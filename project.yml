name: PrivateMusic
options:
  bundleIdPrefix: com.dec
  minimumXcodeGenVersion: 2.46.0
  postGenCommand: python3 scripts/fix_watch_embedding.py
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    # Warnings only (Swift 5 mode): surfaces data-race diagnostics in CI logs
    # without failing the build while the @unchecked Sendable debt is paid down.
    SWIFT_STRICT_CONCURRENCY: targeted
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # The Rust core is built by a script phase that writes to the temp dir
    # and may fetch the toolchain, which the user-script sandbox forbids.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CURRENT_PROJECT_VERSION: 183
    MARKETING_VERSION: 3.30.15
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  configs:
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      GCC_GENERATE_DEBUGGING_SYMBOLS: YES
targets:
  PrivateMusic:
    type: application
    platform: iOS
    sources:
      - path: PrivateMusic
        excludes:
          - Resources/Info.plist
          - Resources/PrivateMusic.entitlements
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PrivateMusic/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PrivateMusic/Resources/PrivateMusic.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.dec.privatemusic2
        SWIFT_OBJC_BRIDGING_HEADER: PrivateMusic/Native/PrivateMusic-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_TEMP_DIR)/rust/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "$(inherited) -lpm_native"
    preBuildScripts:
      - name: Build Rust native core
        script: |
          "${SRCROOT}/scripts/build-rust.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - target: PrivateMusicWatch
        embed: true
      - target: PrivateMusicWidgets
        embed: true
    scheme:
      testTargets:
        - PrivateMusicTests
  PrivateMusicWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: PrivateMusicWatch
      - path: PrivateMusic/Shared/WatchRemoteProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dec.privatemusic2.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Private Music
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.dec.privatemusic2
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 4
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
    scheme: {}
  PrivateMusicWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PrivateMusicWidgets
        excludes:
          - PrivateMusicWidgets.entitlements
          - Info.plist
      - path: PrivateMusic/Shared/RecentWidgetSnapshot.swift
      - path: PrivateMusic/Shared/RecentMusicWidgetView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dec.privatemusic2.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PrivateMusicWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Private Music
        CODE_SIGN_ENTITLEMENTS: PrivateMusicWidgets/PrivateMusicWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    scheme: {}
  PrivateMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PrivateMusicTests
    dependencies:
      - target: PrivateMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dec.privatemusic2.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: PrivateMusic/Native/PrivateMusic-Bridging-Header.h
